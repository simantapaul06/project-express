server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/application_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
# spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Resilience4j Circuit Breaker - Job Service
resilience4j.circuitbreaker.instances.jobService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.jobService.sliding-window-size=5
resilience4j.circuitbreaker.instances.jobService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.jobService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.jobService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.jobService.permitted-number-of-calls-in-half-open-state=2

# JobNotFoundException is a business exception, not a Job Service failure
resilience4j.circuitbreaker.instances.jobService.ignore-exceptions=com.projectexpress.application_service.exception.JobNotFoundException

# Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

# Resilience4j Retry - Job Service
resilience4j.retry.instances.jobService.max-attempts=3
resilience4j.retry.instances.jobService.wait-duration=2s
resilience4j.retry.instances.jobService.ignore-exceptions=com.projectexpress.application_service.exception.JobNotFoundException

# OpenFeign Timeout (HTTP timeout)
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000