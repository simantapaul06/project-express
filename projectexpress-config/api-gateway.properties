server.port=8080

# JWT
jwt.secret=${JWT_SECRET}

# Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Job Service
spring.cloud.gateway.server.webmvc.routes[1].id=job-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://job-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/jobs/**,/api/locations/**

# Application Service
spring.cloud.gateway.server.webmvc.routes[2].id=application-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://application-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/applications/**

# Notification Service
spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/notifications/**

# Profile Service
spring.cloud.gateway.server.webmvc.routes[4].id=profile-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://profile-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/profiles/**

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/